{% extends 'qna/layout/base.html' %}
{% load static %}
{% load django_bootstrap5 %}

{% block content %}

<div class="col-9 d-flex flex-column gap-3">
  <div class="d-flex gap-3 align-items-center">
    <h3>Register</h3>
  </div>
    <form action="" method="POST">
      {% csrf_token %}
      {% bootstrap_form form %}
      {% bootstrap_button button_type="submit" content="Login" %}
  </form>

</div>

{% endblock %}
